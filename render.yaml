services:
  - type: web
    name: supply-chain-backend
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      php artisan storage:link || true
      php artisan config:clear
      php artisan route:clear
      php artisan cache:clear || true
      php artisan migrate --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_DRIVER
        value: database
      # Must be "resend" (not "log") or notification emails are written to logs only.
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_ADDRESS
        value: noreply@emeraldcfze.com
      - key: MAIL_FROM_NAME
        value: Emerald Supply Chain
      # Set the real Resend API key in the Render dashboard (do not commit secrets).
      - key: RESEND_API_KEY
        sync: false
      - key: QUEUE_CONNECTION
        value: sync
      - key: FRONTEND_URL
        value: https://scm.emeraldcfze.com
      - key: DOCUMENTS_DISK
        value: s3
      - key: SIGNATURES_DISK
        value: s3
      - key: QUOTATION_ATTACHMENTS_DISK
        value: s3
      # Required for AI Assistant — set the real key in the Render dashboard (do not commit secrets).
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

