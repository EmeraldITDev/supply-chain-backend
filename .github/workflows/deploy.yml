name: Deploy to cPanel

# Every push to main deploys to cPanel. It can also be started by hand:
# Actions tab -> Deploy to cPanel -> Run workflow.
#
# 1. Build the app with production packages and pack it into one release.zip.
# 2. Upload that single file over FTPS to <domain>/.deploy/release.zip.
# 3. Call public/deploy.php on the server: unpack it (never .env or storage/),
#    then clear caches and run the migrations.
#
# Repo secrets needed (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD  - the cPanel FTP account (directory: public_html)
#   DEPLOY_TOKEN                            - same value as DEPLOY_TOKEN in the server's .env

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

env:
  APP_DOMAIN: scm-api.emeraldcfze.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD DEPLOY_TOKEN; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Nothing was deployed."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist

      - name: Build release.zip
        run: |
          zip -qr "$RUNNER_TEMP/release.zip" . \
            -x '.git/*' '.github/*' '.gitignore' '.gitattributes' \
               '.env' '.env.*' 'storage/*' 'node_modules/*' 'tests/*' 'docs/*' \
               'render.yaml' 'Dockerfile' 'dockerfile' '.dockerignore' \
               'phpunit.xml' '.phpunit.result.cache' '.editorconfig'
          ls -lh "$RUNNER_TEMP/release.zip"

      - name: Upload release.zip
        run: |
          curl --fail -sS --ssl-reqd --ftp-create-dirs --retry 3 --retry-delay 10 \
            --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
            -T "$RUNNER_TEMP/release.zip" \
            "ftp://${FTP_SERVER}/${APP_DOMAIN}/.deploy/release.zip"
          echo "Uploaded."

      - name: Install release on server
        run: |
          curl --fail-with-body -sS --max-time 900 -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "https://${APP_DOMAIN}/deploy.php?step=extract"

      - name: Run migrations
        run: |
          curl --fail-with-body -sS --max-time 600 -X POST \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "https://${APP_DOMAIN}/deploy.php?step=migrate"

      - name: Health check
        run: |
          curl --fail -sS --retry 3 --retry-delay 5 --retry-all-errors -o /dev/null \
            -w "GET /up: HTTP %{http_code}\n" "https://${APP_DOMAIN}/up"
