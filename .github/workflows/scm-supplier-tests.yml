name: SCM Supplier Resolution Tests

on:
  push:
    paths:
      - 'app/Services/SupplierResolutionService.php'
      - 'app/Services/ManualVendorOnboardingService.php'
      - 'app/Services/VendorApprovalService.php'
      - 'app/Http/Controllers/Api/V1/Logistics/VendorController.php'
      - 'app/Http/Controllers/Api/V1/Logistics/AuthController.php'
      - 'app/Http/Controllers/Api/VendorController.php'
      - 'database/**'
      - 'tests/Feature/SupplierResolutionServiceTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/scm-supplier-tests.yml'
  pull_request:
    paths:
      - 'app/Services/SupplierResolutionService.php'
      - 'app/Services/ManualVendorOnboardingService.php'
      - 'app/Services/VendorApprovalService.php'
      - 'app/Http/Controllers/Api/V1/Logistics/VendorController.php'
      - 'app/Http/Controllers/Api/V1/Logistics/AuthController.php'
      - 'app/Http/Controllers/Api/VendorController.php'
      - 'database/**'
      - 'tests/Feature/SupplierResolutionServiceTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/scm-supplier-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supplier-resolution:
    runs-on: ubuntu-latest

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUICKBOOKS_DRY_RUN: 'true'
      QUICKBOOKS_WRITES_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create empty test environment file
        run: |
          test ! -e .env
          test ! -e .env.testing
          touch .env

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate changed PHP migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
            bash .github/scripts/validate-migrations.sh "$base"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [[ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            bash .github/scripts/validate-migrations.sh "$EVENT_BEFORE"
          else
            bash .github/scripts/validate-migrations.sh --all
          fi

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --dev

      - name: Verify isolated test environment
        run: |
          test -f .env
          test ! -e .env.testing
          php artisan migrate --force

      - name: Run Stage A supplier-resolution regression tests
        id: phpunit
        continue-on-error: true
        run: |
          mkdir -p storage/test-results
          php artisan test tests/Feature/SupplierResolutionServiceTest.php \
            --colors=always \
            --display-warnings \
            --fail-on-warning \
            --fail-on-risky \
            --log-junit=storage/test-results/supplier-resolution.xml

      - name: Report PHPUnit result counts
        if: always()
        run: |
          php -r '
            $xml = simplexml_load_file("storage/test-results/supplier-resolution.xml");
            $tests = (int) $xml->testsuite[0]["tests"];
            $failures = (int) $xml->testsuite[0]["failures"] + (int) $xml->testsuite[0]["errors"];
            $skipped = (int) $xml->testsuite[0]["skipped"];
            $assertions = (int) $xml->testsuite[0]["assertions"];
            printf("PHPUnit summary: passed=%d failed=%d skipped=%d assertions=%d\\n", $tests - $failures - $skipped, $failures, $skipped, $assertions);
          '

      - name: Fail workflow when PHPUnit fails or warns
        if: steps.phpunit.outcome != 'success'
        run: exit 1
