name: SCM QuickBooks Supplier Tests

on:
  push:
    paths:
      - 'app/Http/Controllers/Api/QuickBooksController.php'
      - 'app/Models/Vendor.php'
      - 'app/Models/VendorQuickBooksMapping.php'
      - 'app/Models/QuickBooksVendorCreationRequest.php'
      - 'app/Services/QuickBooks*.php'
      - 'app/Support/PurchaseOrderCurrency.php'
      - 'app/Support/QuickBooksRoles.php'
      - 'database/migrations/**'
      - 'routes/api.php'
      - 'tests/Feature/QuickBooksIntegrationTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/scm-quickbooks-supplier-tests.yml'
  pull_request:
    paths:
      - 'app/Http/Controllers/Api/QuickBooksController.php'
      - 'app/Models/Vendor.php'
      - 'app/Models/VendorQuickBooksMapping.php'
      - 'app/Models/QuickBooksVendorCreationRequest.php'
      - 'app/Services/QuickBooks*.php'
      - 'app/Support/PurchaseOrderCurrency.php'
      - 'app/Support/QuickBooksRoles.php'
      - 'database/migrations/**'
      - 'routes/api.php'
      - 'tests/Feature/QuickBooksIntegrationTest.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/scm-quickbooks-supplier-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickbooks-supplier:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      QUICKBOOKS_DRY_RUN: 'true'
      QUICKBOOKS_WRITES_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create empty test environment file
        run: |
          test ! -e .env
          test ! -e .env.testing
          touch .env

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate changed PHP migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$(git merge-base HEAD "origin/$BASE_REF")"
            bash .github/scripts/validate-migrations.sh "$base"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$EVENT_BEFORE" ] && [[ "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            bash .github/scripts/validate-migrations.sh "$EVENT_BEFORE"
          else
            bash .github/scripts/validate-migrations.sh --all
          fi

      - run: composer install --prefer-dist --no-progress --no-interaction --dev

      - name: Run QuickBooks supplier tests
        run: |
          php artisan migrate --force
          php artisan test tests/Feature/QuickBooksIntegrationTest.php \
            --colors=always \
            --display-warnings \
            --fail-on-warning \
            --fail-on-risky
